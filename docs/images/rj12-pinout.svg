<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">RJ12 pin numbering for the P1 port</title>
  <desc id="d">Two views. Left: an RJ12 plug held with its gold contacts facing you, plug tip up and the latch tab on the back; pin 1 is the leftmost contact. Right: the meter socket seen from the front with the latch notch at the bottom; pin 1 is the leftmost contact.</desc>

  <rect x="1" y="1" width="778" height="498" rx="12" fill="#ffffff" stroke="#c5ccd6" stroke-width="2"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2255c"/>
    </marker>
  </defs>

  <!-- ============ Left: plug ============ -->
  <text x="200" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2430">Plug on the cable</text>
  <text x="200" y="63" text-anchor="middle" font-size="14" fill="#4a5564">gold contacts facing you, tip pointing up</text>

  <!-- pin numbers -->
  <g font-size="17" font-weight="700" text-anchor="middle" fill="#1b2430">
    <text x="135" y="104" fill="#c2255c">1</text>
    <text x="161" y="104">2</text>
    <text x="187" y="104">3</text>
    <text x="213" y="104">4</text>
    <text x="239" y="104">5</text>
    <text x="265" y="104">6</text>
  </g>

  <!-- plug body -->
  <rect x="110" y="114" width="180" height="196" rx="6" fill="#e8edf3" stroke="#4a5564" stroke-width="2.5"/>
  <!-- contacts -->
  <g stroke="#7a5b00" stroke-width="1.5">
    <rect x="128" y="122" width="14" height="74" rx="2" fill="#c2255c" stroke="#7d1238"/>
    <rect x="154" y="122" width="14" height="74" rx="2" fill="#e0a800"/>
    <rect x="180" y="122" width="14" height="74" rx="2" fill="#e0a800"/>
    <rect x="206" y="122" width="14" height="74" rx="2" fill="#e0a800"/>
    <rect x="232" y="122" width="14" height="74" rx="2" fill="#e0a800"/>
    <rect x="258" y="122" width="14" height="74" rx="2" fill="#e0a800"/>
  </g>
  <text x="200" y="240" text-anchor="middle" font-size="13" fill="#4a5564">latch tab is on the</text>
  <text x="200" y="258" text-anchor="middle" font-size="13" fill="#4a5564">back, facing away</text>
  <!-- cable -->
  <rect x="172" y="310" width="56" height="78" fill="#c9d1da" stroke="#4a5564" stroke-width="2.5"/>
  <text x="200" y="408" text-anchor="middle" font-size="13" fill="#4a5564">cable</text>

  <!-- pin 1 callout -->
  <text x="24" y="152" font-size="16" font-weight="700" fill="#c2255c">Pin 1</text>
  <text x="24" y="171" font-size="13" fill="#c2255c">+5 V</text>
  <line x1="72" y1="152" x2="122" y2="152" stroke="#c2255c" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- divider -->
  <line x1="390" y1="28" x2="390" y2="418" stroke="#d9dee5" stroke-width="2"/>

  <!-- ============ Right: socket ============ -->
  <text x="585" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2430">Socket on the meter</text>
  <text x="585" y="63" text-anchor="middle" font-size="14" fill="#4a5564">looking straight into it, latch notch at the bottom</text>

  <g font-size="17" font-weight="700" text-anchor="middle" fill="#1b2430">
    <text x="520" y="104" fill="#c2255c">1</text>
    <text x="546" y="104">2</text>
    <text x="572" y="104">3</text>
    <text x="598" y="104">4</text>
    <text x="624" y="104">5</text>
    <text x="650" y="104">6</text>
  </g>

  <!-- socket housing -->
  <rect x="480" y="114" width="210" height="196" rx="6" fill="#dfe5ec" stroke="#4a5564" stroke-width="2.5"/>
  <!-- opening with latch notch at the bottom -->
  <path d="M498 130 H672 V268 H615 V292 H555 V268 H498 Z" fill="#2c343f" stroke="#1b2430" stroke-width="2"/>
  <!-- contacts at the top of the opening -->
  <g stroke="#7a5b00" stroke-width="1.5">
    <rect x="514" y="130" width="12" height="44" fill="#c2255c" stroke="#7d1238"/>
    <rect x="540" y="130" width="12" height="44" fill="#e0a800"/>
    <rect x="566" y="130" width="12" height="44" fill="#e0a800"/>
    <rect x="592" y="130" width="12" height="44" fill="#e0a800"/>
    <rect x="618" y="130" width="12" height="44" fill="#e0a800"/>
    <rect x="644" y="130" width="12" height="44" fill="#e0a800"/>
  </g>
  <text x="585" y="334" text-anchor="middle" font-size="13" fill="#4a5564">latch notch</text>
  <line x1="585" y1="320" x2="585" y2="296" stroke="#4a5564" stroke-width="1.5"/>

  <!-- pin 1 callout -->
  <text x="408" y="152" font-size="16" font-weight="700" fill="#c2255c">Pin 1</text>
  <text x="408" y="171" font-size="13" fill="#c2255c">+5 V</text>
  <line x1="456" y1="152" x2="508" y2="152" stroke="#c2255c" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="585" y="368" text-anchor="middle" font-size="13" fill="#1b2430">If the notch on your meter is at the top,</text>
  <text x="585" y="386" text-anchor="middle" font-size="13" fill="#1b2430">turn this picture upside down: pin 1 is then on the right.</text>

  <!-- ============ Legend ============ -->
  <line x1="24" y1="428" x2="756" y2="428" stroke="#d9dee5" stroke-width="2"/>
  <g font-size="14" fill="#1b2430">
    <text x="24" y="455"><tspan font-weight="700" fill="#c2255c">1</tspan> +5 V power</text>
    <text x="150" y="455"><tspan font-weight="700">2</tspan> Data request</text>
    <text x="290" y="455"><tspan font-weight="700">3</tspan> Data ground</text>
    <text x="424" y="455"><tspan font-weight="700">4</tspan> Not used</text>
    <text x="530" y="455"><tspan font-weight="700">5</tspan> Data out</text>
    <text x="634" y="455"><tspan font-weight="700">6</tspan> Power ground</text>
  </g>
  <text x="24" y="482" font-size="13" fill="#4a5564">Count six gold contacts. A plug with only four is RJ11 and has no pin 1 or pin 6.</text>
</svg>
