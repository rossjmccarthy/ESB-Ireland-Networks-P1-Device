name: Firmware and web flasher

# Builds the ready-made firmware for every board in esphome/boards/ and
# publishes the web flasher page to GitHub Pages. Pull requests only build.

on:
  push:
    branches:
      - main
    paths:
      - "esphome/**"
      - "web/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "esphome/**"
      - "web/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: List boards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      boards: ${{ steps.boards.outputs.boards }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: List board files
        id: boards
        run: |
          set -euo pipefail
          boards=$(ls esphome/boards/*.yaml | xargs -n1 basename | sed 's/\.yaml$//' | jq -R . | jq -sc .)
          echo "boards=${boards}" >> "$GITHUB_OUTPUT"
          echo "Boards: ${boards}"

      - name: Set firmware version
        id: version
        run: echo "version=$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.board }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.prepare.outputs.boards) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build firmware
        id: esphome
        uses: esphome/build-action@ae5408cdbc4f70692bf8e345c4982bca05a93667  # v8.1.0
        with:
          yaml-file: esphome/esb-p1-reader.factory.yaml
          version: 2026.10.2
          substitutions: |
            board_id=${{ matrix.board }}
            project_version=${{ needs.prepare.outputs.version }}

      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: firmware-${{ matrix.board }}
          path: |
            ${{ steps.esphome.outputs.name }}/manifest.json
            ${{ steps.esphome.outputs.name }}/*.bin
          if-no-files-found: error
          retention-days: 30

  site:
    name: Assemble web flasher
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download firmware
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: firmware-*
          path: builds

      - name: Assemble site
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p site/firmware
          cp -r web/. site/
          touch site/.nojekyll

          wrap='{
            name: "ESB P1 Reader",
            version: $version,
            home_assistant_domain: "esphome",
            new_install_prompt_erase: true,
            builds: .
          }'

          # One manifest per board, so the page installs exactly the build
          # the visitor picked.
          for dir in builds/firmware-*; do
            board="${dir#builds/firmware-}"
            cp "${dir}"/*.bin site/firmware/
            jq --arg version "${VERSION}" -s "${wrap}" "${dir}/manifest.json" \
              > "site/firmware/${board}.manifest.json"
          done

          # A combined manifest that lets the installer pick by detected chip.
          jq --arg version "${VERSION}" -s "${wrap}" builds/firmware-*/manifest.json \
            > site/firmware/manifest.json

          ls -l site/firmware
          jq -r '.builds[] | "\(.chipFamily): \(.parts[0].path)"' site/firmware/manifest.json

      - name: Upload firmware bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: web-flasher-firmware
          path: site/firmware
          retention-days: 30

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
          retention-days: 1

  publish:
    name: Publish web flasher
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
